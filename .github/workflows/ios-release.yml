# Builds the iPhone app and sends it to Apple (TestFlight / App Store Connect). No Mac needed.
#
# How to run it: GitHub > Actions > "iPhone app - send to Apple" > Run workflow.
#
# It needs four secrets (GitHub > Settings > Secrets and variables > Actions), from App Store Connect:
#   APPLE_TEAM_ID                 your 10-character Team ID (developer.apple.com/account > Membership details)
#   APP_STORE_CONNECT_KEY_ID      the Key ID of an App Store Connect API key with the Admin role
#   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY         the whole text of the downloaded AuthKey_XXXX.p8 file
# Apple makes the signing certificate and profile automatically the first time.
name: iPhone app - send to Apple

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number people see in the App Store (for example 1.0)"
        required: true
        default: "1.0"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
    steps:
      - name: Check the Apple secrets are set
        working-directory: .
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ "$HAS_KEY" = "true" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing. See the notes at the top of this workflow."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Put the web app inside the iPhone app
        run: npm ci && npm run sync
      - name: Save the API key for Xcode
        env:
          KEY_TEXT: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_TEXT" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and sign
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -60
      - name: Send to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
          echo "Sent build ${{ github.run_number }} (version ${{ inputs.version }}) to Apple. It shows up in App Store Connect > TestFlight in about 15-30 minutes."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

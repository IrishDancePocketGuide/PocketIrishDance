name: Feis probe (temporary)
on:
  push:
    branches: ["claude/project-thread-7nt7dz"]
    paths: [".github/workflows/feis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe regional calendars
        run: |
          UA="PocketIrishDanceBot/1.0 (+https://irishdancepocketguide.github.io/PocketIrishDance/)"
          i=0
          for u in https://www.idtac-er.com/regional-feiseanna https://www.wcidta.ca/feis-dates https://midamericaregion.com/region-information/feis-calendar/ https://www.mid-atlanticregion.com/feis-info https://www.neidt.org/feiseanna https://www.idtana-southernregion.com/calendar https://www.westernusregion.com/feiseanna; do
            i=$((i+1)); host=$(echo $u | awk -F/ '{print $3}')
            curl -sSL -m 30 -A "$UA" -o "p$i.html" -w "$i $u %{http_code} %{size_download}\n" "$u"
            curl -sSL -m 20 -A "$UA" -o "r$i.txt" "https://$host/robots.txt"
          done
          python3 - <<'PY'
          import re,glob
          for i in range(1,8):
              s=open(f"p{i}.html",encoding="utf-8",errors="replace").read()
              r=open(f"r{i}.txt",encoding="utf-8",errors="replace").read()
              gen=re.findall(r'<meta name="generator" content="([^"]+)"',s)
              print(f"\n######## {i} generator={gen} wix={'wix' in s.lower()[:5000]} squarespace={'squarespace' in s.lower()[:20000]}")
              print("-- robots:", re.sub(r'\s+',' ',r)[:600])
              b=re.sub(r'(?is)<(script|style|noscript|svg)[^>]*>.*?</\1>',' ',s)
              t=re.sub(r'<[^>]+>','\n',b); t=re.sub(r'&nbsp;|&#160;',' ',t)
              lines=[l.strip() for l in t.split('\n') if l.strip()]
              txt=' | '.join(lines)
              k=max(txt.find('2027'),0); j=txt.find('2026')
              start=min(x for x in [k,j] if x>0) if (k>0 or j>0) else 0
              print("-- text:", txt[max(0,start-1500):start+3500])
              print("-- date-ish count:", len(re.findall(r'(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}',txt)))
              print("-- ext links:", sorted(set(re.findall(r'href="(https?://(?!(?:www\.)?(?:facebook|instagram|twitter|youtube|google|wix|squarespace))[^"]+)"',s)))[:40])
          PY

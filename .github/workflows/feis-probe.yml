name: Feis probe (temporary)
on:
  push:
    branches: ["claude/project-thread-7nt7dz"]
    paths: [".github/workflows/feis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          UA="PocketIrishDanceBot/1.0 (+https://irishdancepocketguide.github.io/PocketIrishDance/)"
          curl -sSL -A "$UA" -o idtana.html https://idtana.org/feiseanna/; sleep 10
          curl -sSL -A "$UA" -o idtana2.html "https://idtana.org/feiseanna/?sf_paged=2"
          curl -sSL -A "$UA" -o comh.html https://web.irishdancingorg.com/apps/feiscalendar.php
          curl -sSL -A "$UA" -o wida.html https://www.irish.dance/competitions-list
          curl -sS -A "$UA" -w "robots %{http_code}\n" -o comhrobots.txt https://web.irishdancingorg.com/robots.txt
          ls -la
      - name: Show structure
        run: |
          for f in idtana.html comh.html wida.html; do echo "===== $f"; grep -c "" $f; done
          echo "===== IDTANA around first event"; grep -n -m3 "events/" idtana.html | cut -c1-400
          python3 - <<'PY'
          import re
          for f,key in [("idtana.html","Portland"),("idtana2.html","Feis"),("comh.html","Carlin"),("wida.html","Edinburgh")]:
              s=open(f,encoding="utf-8",errors="replace").read()
              i=s.find(key)
              print("=====",f,len(s),"key at",i)
              print(s[max(0,i-3000):i+3000] if i>=0 else s[:3000])
          s=open("idtana.html",encoding="utf-8",errors="replace").read()
          print("===== idtana paging links", set(re.findall(r'sf_paged=\d+',s)))
          print("===== idtana event count", len(set(re.findall(r'idtana\.org/events/[^"/]+/',s))))
          s=open("wida.html",encoding="utf-8",errors="replace").read()
          print("===== wida articles", s.count("eventlist-event"), "pagination", re.findall(r'href="([^"]*offset=[^"]*)"',s)[:3])
          s=open("comh.html",encoding="utf-8",errors="replace").read()
          print("===== comh rows", s.count("<tr"))
          PY
          cat comhrobots.txt | head -20

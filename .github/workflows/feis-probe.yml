name: Feis probe (temporary)
on:
  push:
    branches: ["claude/project-thread-7nt7dz"]
    paths: [".github/workflows/feis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IDTANA
        run: |
          UA="PocketIrishDanceBot/1.0 (+https://irishdancepocketguide.github.io/PocketIrishDance/)"
          curl -sSL -m 30 -A "$UA" -o idtana.html https://idtana.org/feiseanna/; sleep 10
          curl -sSL -m 30 -A "$UA" -w "rest %{http_code}\n" -D resth.txt -o rest.json "https://idtana.org/wp-json/wp/v2/events?per_page=100&_fields=id,link,title,date,modified,meta,acf,class_list"; sleep 10
          grep -i "x-wp-total" resth.txt || true
          curl -sSL -m 30 -A "$UA" -w "types %{http_code}\n" -o types.json "https://idtana.org/wp-json/wp/v2/types"
          python3 - <<'PY'
          import re,json
          s=open("idtana.html",encoding="utf-8",errors="replace").read()
          i=s.find("Western US</a>")
          t=re.sub(r'\s+',' ',s[i:i+6000])
          print("== after region tags ==",t[:5000])
          print("== text of listing ==")
          j=s.find('<article id="post-'); k=s.rfind('</article>')
          txt=re.sub(r'<[^>]+>',' | ',s[j:k]); txt=re.sub(r'(\s*\|\s*)+',' | ',txt)
          print(txt[:6000])
          print("== load more / pagination hints ==", re.findall(r'(load[-_ ]more[^"]{0,60}|ecs-load-more[^"]{0,60}|max_num_pages[^,]{0,30}|data-max-page="\d+")',s)[:10])
          print("== region calendar links ==", sorted(set(re.findall(r'href="(https?://[^"]*(?:calendar|feis)[^"]*)"',s)))[:40])
          try:
            d=json.load(open("rest.json")); print("== REST count",len(d)); print(json.dumps(d[:2],indent=1)[:4000])
          except Exception as e: print("REST err",e, open("rest.json").read()[:800])
          try:
            t=json.load(open("types.json")); print("== types", list(t.keys()))
          except Exception as e: print("types err",e)
          PY
